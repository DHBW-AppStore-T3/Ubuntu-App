# App contract v2: this app runs as pods, not as a VM (the VM version, v1.x, is only available via its git tag).
# One web terminal per person: a persistent bash session in the browser, no SSH, no sudo.
apiVersion: appstore/v2
name: ubuntu-app
runtime: kubernetes
scope: user
scopeChoice: true
workload:
  containers:
    - name: terminal
      # Built by .github/workflows/ci.yml. After changing image/, copy the new digest here.
      image: ghcr.io/dhbw-appstore-t3/apps/ubuntu-app@sha256:be0c1aa28c3e4ce46f807556ff8c3732465178b4f7886aa9df58b0b4562f6ca5
      expose: { port: 8080, path: / }
      # An idle terminal needs a few MiB: reserve little, allow bursts for what students run (pip and npm installs,
      # compiling, the loops of the exercises).
      resources: { cpu: "1", memory: 1Gi, requests: { cpu: 50m, memory: 128Mi } }
      env:
        - { name: PASSWORD, from: generated-password }
        - { name: APP_USER, from: user-name }
      writablePaths: [/tmp]
  storage: { size: 2Gi, mountPath: /home/student }
# What the terminal may reach (the contract: app-registry README, "network"). The course exercises work offline; the
# internet is only for curl, pip and npm, so it starts off and a teacher switches it on where a course needs it.
# Students' own TCP/UDP servers and clients between the terminals of one deployment: a choice, off by default.
network:
  internet: { allowed: true, default: false }
  podNetwork: { allowed: true, default: false }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
  - { type: password, from: generated-password, username: "{user}" }
